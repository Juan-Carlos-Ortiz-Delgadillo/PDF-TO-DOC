name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install ".[dev]"
      - name: Update the environment installer
        run: python -m pip install --upgrade pip
      - name: Lint
        run: ruff check app tests build.py scripts/benchmark_startup.py
      - name: Type check
        run: mypy
      - name: Guard dynamically imported conversion dependencies
        run: pytest tests/test_build.py -q
      - name: Test core application logic
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          pytest
          --cov=app.core
          --cov=app.models
          --cov=app.services.conversion_service
          --cov=app.services.pdf_analyzer
          --cov=app.services.output_service
          --cov=app.utils.file_utils
          --cov=app.utils.validation
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Security analysis
        run: bandit -q -r app -ll
      - name: Dependency audit
        run: pip-audit --skip-editable

  startup:
    name: Packaged startup (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-2022
          - target: linux-x86_64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Install project and build tools
        run: python -m pip install ".[dev]"
      - name: Build and enforce packaged startup budget
        run: python build.py --mode onedir
      - name: Upload startup benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-benchmark-${{ matrix.target }}
          path: dist/startup-benchmark.json
          if-no-files-found: warn
