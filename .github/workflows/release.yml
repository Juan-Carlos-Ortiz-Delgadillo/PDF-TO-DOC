name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-native
            runner: macos-14
          - target: windows-x86_64
            runner: windows-2022
          - target: linux-x86_64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and build tools
        run: python -m pip install ".[dev]"
      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Update the environment installer
        run: python -m pip install --upgrade pip
      - name: Build onedir and enforce startup budget
        run: python build.py --mode onedir
      - name: Upload startup benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-benchmark-${{ matrix.target }}
          path: dist/startup-benchmark.json
          if-no-files-found: warn
      - name: Create Finder drag-and-drop DMG
        if: runner.os == 'macOS'
        run: ./scripts/build-dmg.sh --skip-build
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/PDF2Word-*.zip
            dist/PDF2Word-*.tar.gz
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
      - name: Upload macOS drag-and-drop installer
        if: matrix.target == 'macos-native'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-dmg
          path: |
            dist/PDF2Word.dmg
            dist/PDF2Word.dmg.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --generate-notes
